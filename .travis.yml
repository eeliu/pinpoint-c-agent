os: linux
language: python

jobs:
  include:
    - name: "common"
      env:
        - ROOT=$PWD
      script:
        - cd common
        - mkdir -p build
        - cd build
        - cmake -DCMAKE_BUILD_TYPE=Release .. 
        - make 
        - ./test/unittest

    - php: "7.3"
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PHP/pinpoint_php_ext/
        - sh agent_start.sh
        - phpize && ./configure && make
        - make test
    - php: "7.2"
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PHP/pinpoint_php_ext/
        - sh agent_start.sh
        - phpize && ./configure && make
        - make test

    - php: "7.1"
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PHP/pinpoint_php_ext/
        - sh agent_start.sh
        - phpize && ./configure && make
        - make test
    - name: "python 3.8"
      python: 
        - "3.8"
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PY/pinpoint-py-module/
        - pip install -r requirements.txt 
        - sh run_before_setup.sh
        - python3 setup.py install
        - nosetests --exclude-test-file=test/TestUnderProcessMode.py ##

    - name: "python 3.6"
      python: 
      - 3.6
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PY/pinpoint-py-module/
        - pip install -r requirements.txt 
        - sh run_before_setup.sh
        - python3 setup.py install
        - nosetests --exclude-test-file=test/TestUnderProcessMode.py ##
    - name: "python 3.5"
      python: 
      - 3.5
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PY/pinpoint-py-module/
        - pip install -r requirements.txt 
        - sh run_before_setup.sh
        - python3 setup.py install
        - nosetests --exclude-test-file=test/TestUnderProcessMode.py ##

    - name: "python 3.7"
      python: 
        - "3.7"
      env:
        - ROOT=$PWD
      script:
        - cmake --version
        - cd $ROOT/PY/pinpoint-py-module/
        - pip install -r requirements.txt 
        - sh run_before_setup.sh
        - python3 setup.py install
        - nosetests --exclude-test-file=test/TestUnderProcessMode.py ##

